<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Concepts</title>
<style>
  :root {
    --bg: #0e0e0d; --text: #e8e4da; --muted: #8f8b81; --faint: #5d5a54;
    --accent: #f2c14e; --boost: #ff8a2a; --cut: #e5484d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, "Segoe UI", system-ui, sans-serif; }
  header { padding: 22px 28px 6px; }
  h1 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); max-width: 760px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 18px; padding: 18px 28px 40px; }
  figure { margin: 0; padding: 14px 14px 16px; border-radius: 12px; background: #151514; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); }
  figcaption { margin-bottom: 10px; }
  figcaption b { font-size: 13.5px; font-weight: 600; }
  figcaption span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .stage {
    display: grid; place-items: end center; height: 190px; border-radius: 8px; overflow: hidden;
    background: radial-gradient(circle at 50% 10%, rgba(70,110,170,0.22), transparent 60%), #111110;
  }
  svg { display: block; overflow: visible; }
</style>
</head>
<body>
<header>
  <h1>3DQ band panel: clean-up concepts</h1>
  <p>Same band in each: band 3, Peak, 2.40 kHz, +3.5 dB, Q 0.90, Mid, dynamic range -6 dB. A is the panel as it is now.</p>
</header>
<div class="grid" id="grid"></div>

<script>
"use strict";
// Small SVG builders, so each concept is a recipe of the same parts.
const W = 456, C = { text: "#e8e4da", muted: "#8f8b81", faint: "#5d5a54", pale: "#fffcf4", accent: "#f2c14e", boost: "#ff8a2a", cut: "#e5484d" };
const START = -0.75 * Math.PI, SWEEP = 1.5 * Math.PI;
const pt = (cx, cy, r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
const arc = (cx, cy, r, a0, a1) => {
  const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
  if (hi - lo < 0.01) return "";
  const [x0, y0] = pt(cx, cy, r, lo), [x1, y1] = pt(cx, cy, r, hi);
  return `M${x0} ${y0} A${r} ${r} 0 ${hi - lo > Math.PI ? 1 : 0} 1 ${x1} ${y1}`;
};
const ang = (t) => START + t * SWEEP;
const path = (d, stroke, w = 1.5, extra = "") => `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
const text = (x, y, s, { size = 11, weight = 500, fill = C.text, anchor = "middle", spacing = 0 } = {}) =>
  `<text x="${x}" y="${y}" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}" letter-spacing="${spacing}" dominant-baseline="middle" font-family="Inter, Segoe UI, system-ui, sans-serif">${s}</text>`;
const rrect = (x, y, w, h, r, fill, stroke = "none") => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}"/>`;

// Icons, centred on (x, y).
const icons = {
  power: (x, y, c) => path(`M${x} ${y - 4.6} L${x} ${y - 0.4} ` + arc(x, y + 0.6, 4.2, 0.7, 2 * Math.PI - 0.7).replace("M", "M"), c),
  solo: (x, y, c) => text(x, y + 0.5, "S", { size: 11, weight: 700, fill: c }),
  gear: (x, y, c) => {
    let d = `M${x - 2.4} ${y} a2.4 2.4 0 1 0 4.8 0 a2.4 2.4 0 1 0 -4.8 0`;
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; d += ` M${x + Math.cos(a) * 3.9} ${y + Math.sin(a) * 3.9} L${x + Math.cos(a) * 5.4} ${y + Math.sin(a) * 5.4}`; }
    return path(d, c, 1.3);
  },
  bin: (x, y, c) => path(`M${x - 3.8} ${y - 2.6} H${x + 3.8} M${x - 1.4} ${y - 2.6} V${y - 4} H${x + 1.4} V${y - 2.6} M${x - 2.6} ${y - 2.6} L${x - 2} ${y + 4.2} H${x + 2} L${x + 2.6} ${y - 2.6}`, c, 1.3),
  close: (x, y, c) => path(`M${x - 3} ${y - 3} L${x + 3} ${y + 3} M${x + 3} ${y - 3} L${x - 3} ${y + 3}`, c),
  left: (x, y, c) => path(`M${x + 1.8} ${y - 3.5} L${x - 1.8} ${y} L${x + 1.8} ${y + 3.5}`, c),
  right: (x, y, c) => path(`M${x - 1.8} ${y - 3.5} L${x + 1.8} ${y} L${x - 1.8} ${y + 3.5}`, c),
  caret: (x, y, c) => path(`M${x - 2.5} ${y - 1.2} L${x} ${y + 1.3} L${x + 2.5} ${y - 1.2}`, c, 1.3),
  peak: (x, y, c) => path(`M${x - 8} ${y + 3.5} C${x - 3} ${y + 3.5} ${x - 2} ${y - 4} ${x} ${y - 4} C${x + 2} ${y - 4} ${x + 3} ${y + 3.5} ${x + 8} ${y + 3.5}`, c, 1.4),
  hp: (x, y, c) => path(`M${x - 8} ${y + 4} L${x - 2} ${y - 3} L${x + 8} ${y - 3}`, c, 1.4),
  lp: (x, y, c) => path(`M${x - 8} ${y - 3} L${x + 2} ${y - 3} L${x + 8} ${y + 4}`, c, 1.4),
  ls: (x, y, c) => path(`M${x - 8} ${y - 3} L${x - 2} ${y - 3} L${x + 2} ${y + 3} L${x + 8} ${y + 3}`, c, 1.4),
  hs: (x, y, c) => path(`M${x - 8} ${y + 3} L${x - 2} ${y + 3} L${x + 2} ${y - 3} L${x + 8} ${y - 3}`, c, 1.4),
  stereo: (x, y, c) => `<circle cx="${x - 3}" cy="${y}" r="3.5" fill="none" stroke="${c}" stroke-width="1.3"/><circle cx="${x + 3}" cy="${y}" r="3.5" fill="none" stroke="${c}" stroke-width="1.3"/>`,
};

const defs = `<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2a27"/><stop offset="1" stop-color="#1a1a18"/></linearGradient>
  <linearGradient id="bodyFlat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#242422"/><stop offset="1" stop-color="#1c1c1b"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="rgba(255,255,255,0)"/><stop offset="0.5" stop-color="rgba(242,193,78,0.5)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient>
  <radialGradient id="face" cx="50%" cy="22%" r="85%"><stop offset="0" stop-color="#3a3934"/><stop offset="0.6" stop-color="#24231f"/><stop offset="1" stop-color="#181816"/></radialGradient>
  <radialGradient id="faceFlat" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#2e2d2a"/><stop offset="1" stop-color="#1d1d1b"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,0.16)"/><stop offset="1" stop-color="rgba(255,255,255,0.02)"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.5"/></filter>
</defs>`;

// A knob: matte disc, value arc, dot or tick.
function knob(cx, cy, r, t, { arcColour = C.accent, bipolar = false, track = true, flat = false, trackGroove = false, width } = {}) {
  const a = ang(t), from = bipolar ? 0 : START, ar = r - 4;
  let s = `<circle cx="${cx}" cy="${cy + 1.5}" r="${r}" fill="rgba(0,0,0,0.5)"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r - 0.5}" fill="url(#${flat ? "faceFlat" : "face"})"/>`;
  s += `<circle cx="${cx}" cy="${cy}" r="${r - 1}" fill="none" stroke="url(#rim)"/>`;
  if (trackGroove) s += path(arc(cx, cy, ar, START, START + SWEEP), "rgba(0,0,0,0.45)", (width || 2.6) + 1);
  if (track) s += path(arc(cx, cy, ar, from, a), arcColour, width || 2.6);
  const [dx, dy] = pt(cx, cy, track ? ar - 6 : r * 0.5, a), [ex, ey] = pt(cx, cy, r - 5, a);
  s += track ? `<circle cx="${dx}" cy="${dy}" r="1.6" fill="${C.pale}"/>` : path(`M${dx} ${dy} L${ex} ${ey}`, C.pale, 2);
  return s;
}

// Gain with its rings: static gain thin from 0, the range from the gain, handle, threshold notch.
function gain(cx, cy, { well = 49, housing = 0, housingFlat = false, rangeR = 44.5, thrR = 36.5, knobR = 30, mono = false } = {}) {
  let s = "";
  if (housing) {
    s += housingFlat ? "" : `<circle cx="${cx}" cy="${cy + 3}" r="${housing + 2}" fill="rgba(0,0,0,0.45)"/>`;
    s += `<circle cx="${cx}" cy="${cy}" r="${housing}" fill="url(#body)" stroke="rgba(255,255,255,0.09)"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${well}" fill="rgba(0,0,0,0.34)" stroke="rgba(255,255,255,0.05)"/>`;
  const g = (db) => ang((db + 30) / 60);
  s += path(arc(cx, cy, rangeR, START, START + SWEEP), "rgba(255,255,255,0.055)", 6);
  s += path(arc(cx, cy, rangeR, g(0), g(3.5)), mono ? C.text : C.boost, 2);
  s += path(arc(cx, cy, rangeR, g(-2.5), g(3.5)), mono ? "rgba(232,228,218,0.45)" : "rgba(229,72,77,0.55)", 4);
  const [hx, hy] = pt(cx, cy, rangeR, g(-2.5));
  s += `<circle cx="${hx}" cy="${hy}" r="3.6" fill="${mono ? C.text : C.cut}" stroke="#151513" stroke-width="1.2"/>`;
  s += path(arc(cx, cy, thrR, START, START + SWEEP), "rgba(255,255,255,0.05)", 5);
  s += path(arc(cx, cy, thrR, START, ang(0.6)), "rgba(232,228,218,0.3)", 3);
  const ta = ang(0.6), [n0x, n0y] = pt(cx, cy, thrR - 4, ta), [n1x, n1y] = pt(cx, cy, thrR + 4, ta);
  s += path(`M${n0x} ${n0y} L${n1x} ${n1y}`, C.pale, 2.6);
  s += knob(cx, cy, knobR, (3.5 + 30) / 60, { track: false });
  return s;
}

const box = (x, y, w = 22, h = 22, r = 6) => rrect(x, y, w, h, r, "rgba(255,255,255,0.045)", "rgba(255,255,255,0.09)");
const pill = (x, y, w, glyph, label, { bordered = true, fill = "rgba(255,255,255,0.045)" } = {}) =>
  rrect(x, y, w, 26, 7, fill, bordered ? "rgba(255,255,255,0.09)" : "none") + icons[glyph](x + 17, y + 13, C.muted) +
  text(x + 31, y + 13.5, label, { anchor: "start", size: 11.5 }) + icons.caret(x + w - 11, y + 13, C.faint);
const caps = (x, y, s, fill = C.text, size = 9.5) => text(x, y, s, { size, weight: 700, fill, spacing: 0.6 });
const body = (top, h, { fill = "url(#body)", gold = true, r = 12 } = {}) =>
  rrect(0, top, W, h, r, fill, "rgba(255,255,255,0.09)") + (gold ? `<path d="M${r} ${top + 0.5} H${W - r}" stroke="url(#gold)"/>` : "");

const svg = (h, inner) => `<svg width="${W}" height="${h}" viewBox="0 0 ${W} ${h}">${defs}<g filter="url(#shadow)">${inner}</g></svg>`;

// The concepts.
const concepts = [
  {
    name: "A  Now",
    note: "Raised housing, boxed icons, bordered pills, gold top line, name under Q and Gain.",
    draw() {
      const t = 26, cx = W / 2;
      let s = body(t, 98) + gain(cx, 52, { housing: 51 });
      s += box(12, 38) + icons.power(23, 49, C.boost) + box(39, 38) + icons.solo(50, 49, C.muted) + box(66, 38) + icons.gear(77, 49, C.muted);
      s += icons.left(336, 49, C.muted) + text(353, 49.5, "3", { size: 11 }) + icons.right(370, 49, C.muted) + box(395, 38) + icons.bin(406, 49, C.muted) + box(422, 38) + icons.close(433, 49, C.muted);
      s += pill(12, 84, 110, "peak", "Peak") + pill(W - 122, 84, 110, "stereo", "Mid");
      s += knob(cx - 76, 76, 22, 0.66) + knob(cx + 76, 76, 22, 0.55);
      s += text(cx - 76, 110, "2.40 kHz", { weight: 700, size: 10.5 }) + caps(cx, 110, "GAIN") + caps(cx + 76, 110, "Q");
      return svg(124, s);
    },
  },
  {
    name: "B  Quiet",
    note: "Same layout with the chrome taken away: bare icons (a fill only on hover), borderless pills, no gold line, the housing flush with no shadow, every value shown in one muted line.",
    draw() {
      const t = 26, cx = W / 2;
      let s = body(t, 98, { gold: false }) + gain(cx, 52, { housing: 51, housingFlat: true });
      s += icons.power(23, 49, C.boost) + icons.solo(50, 49, C.faint) + icons.gear(77, 49, C.faint);
      s += icons.left(338, 49, C.faint) + text(353, 49.5, "3", { size: 11, fill: C.muted }) + icons.right(368, 49, C.faint) + icons.bin(406, 49, C.faint) + icons.close(433, 49, C.faint);
      s += pill(12, 84, 110, "peak", "Peak", { bordered: false, fill: "rgba(255,255,255,0.035)" }) + pill(W - 122, 84, 110, "stereo", "Mid", { bordered: false, fill: "rgba(255,255,255,0.035)" });
      s += knob(cx - 76, 76, 22, 0.66) + knob(cx + 76, 76, 22, 0.55);
      s += text(cx - 76, 110, "2.40 kHz", { size: 10.5, fill: C.text }) + text(cx, 110, "+3.5 dB", { size: 10.5, fill: C.text }) + text(cx + 76, 110, "0.90", { size: 10.5, fill: C.text });
      return svg(124, s);
    },
  },
  {
    name: "C  Title bar",
    note: "The band's identity reads as one line along the top: number, type and stereo as quiet text menus, tools at the right. The knobs get the whole body; no pills at the bottom, so the panel is shorter.",
    draw() {
      const t = 26, cx = W / 2, h = 112;
      let s = body(t, h - t, { gold: false });
      s += `<path d="M12 ${t + 30.5} H${W - 12}" stroke="rgba(255,255,255,0.06)"/>`;
      s += `<circle cx="24" cy="${t + 15}" r="8" fill="#151513" stroke="${C.boost}" stroke-width="1.5"/>` + text(24, t + 15.5, "3", { size: 9, weight: 700 });
      s += icons.peak(48, t + 15, C.muted) + text(62, t + 15.5, "Peak", { anchor: "start", size: 11.5 }) + icons.caret(96, t + 15, C.faint);
      s += icons.stereo(118, t + 15, C.muted) + text(128, t + 15.5, "Mid", { anchor: "start", size: 11.5 }) + icons.caret(154, t + 15, C.faint);
      s += icons.power(W - 116, t + 15, C.boost) + icons.solo(W - 94, t + 15, C.faint) + icons.gear(W - 72, t + 15, C.faint) + icons.bin(W - 46, t + 15, C.faint) + icons.close(W - 22, t + 15, C.faint);
      s += gain(cx, 52, { housing: 51, housingFlat: true });
      s += knob(cx - 100, 80, 22, 0.66) + knob(cx + 100, 80, 22, 0.55);
      s += text(cx - 100, 107 - 2, "2.40 kHz", { size: 10.5, weight: 600 }) + text(cx, 107, "+3.5 dB", { size: 10.5, weight: 600 }) + text(cx + 100, 107 - 2, "Q 0.90", { size: 10.5, weight: 600 });
      return svg(h + 4, s);
    },
  },
  {
    name: "D  Values first",
    note: "Tiny names above, the values large below, for all three. Tools stack in narrow columns at the far edges; type and stereo become icon-only menus there too.",
    draw() {
      const t = 26, cx = W / 2;
      let s = body(t, 98, { gold: false }) + gain(cx, 52, { housing: 51, housingFlat: true });
      const col = (x, items) => items.map((f, i) => f(x, t + 18 + i * 26)).join("");
      s += `<path d="M44 ${t + 10} V${t + 88} M${W - 44} ${t + 10} V${t + 88}" stroke="rgba(255,255,255,0.06)"/>`;
      s += col(24, [(x, y) => icons.power(x, y, C.boost), (x, y) => icons.solo(x, y, C.faint), (x, y) => icons.gear(x, y, C.faint)]);
      s += col(W - 24, [(x, y) => icons.close(x, y, C.faint), (x, y) => icons.bin(x, y, C.faint), (x, y) => icons.stereo(x, y, C.muted)]);
      s += icons.peak(80, t + 18, C.text) + icons.caret(98, t + 18, C.faint);
      s += icons.left(70, t + 70, C.faint) + text(84, t + 70.5, "3", { size: 12, weight: 600 }) + icons.right(98, t + 70, C.faint);
      s += knob(cx - 84, 72, 22, 0.66) + knob(cx + 84, 72, 22, 0.55);
      s += caps(cx - 84, 43, "FREQ", C.faint, 8.5) + caps(cx + 84, 43, "Q", C.faint, 8.5);
      s += text(cx - 84, 108, "2.40 kHz", { size: 13, weight: 600 }) + text(cx, 111, "+3.5 dB", { size: 13, weight: 600 }) + text(cx + 84, 108, "0.90", { size: 13, weight: 600 });
      return svg(124, s);
    },
  },
  {
    name: "E  One accent",
    note: "Colour only where it means something: Freq and Q go white, Gain keeps orange / red for boost / cut, gold marks only what's chosen. Everything else greyscale.",
    draw() {
      const t = 26, cx = W / 2;
      let s = body(t, 98, { gold: false, fill: "url(#bodyFlat)" }) + gain(cx, 52, { housing: 51 });
      s += icons.power(23, 49, C.text) + icons.solo(50, 49, C.faint) + icons.gear(77, 49, C.faint);
      s += icons.left(338, 49, C.faint) + text(353, 49.5, "3", { size: 11, fill: C.muted }) + icons.right(368, 49, C.faint) + icons.bin(406, 49, C.faint) + icons.close(433, 49, C.faint);
      s += pill(12, 84, 110, "peak", "Peak", { bordered: false }) + pill(W - 122, 84, 110, "stereo", "Mid", { bordered: false });
      s += knob(cx - 76, 76, 22, 0.66, { arcColour: C.text, width: 2, trackGroove: true }) + knob(cx + 76, 76, 22, 0.55, { arcColour: C.text, width: 2, trackGroove: true });
      s += text(cx - 76, 110, "2.40 kHz", { weight: 600, size: 10.5 }) + caps(cx, 110, "GAIN", C.muted) + caps(cx + 76, 110, "Q", C.muted);
      return svg(124, s);
    },
  },
  {
    name: "F  Choices in view",
    note: "No menus to open for the common choices: the five filter shapes and the stereo placement are always-visible segmented rows. Most direct, but busier.",
    draw() {
      const t = 26, cx = W / 2;
      let s = body(t, 98, { gold: false }) + gain(cx, 52, { housing: 51, housingFlat: true });
      s += icons.power(23, 49, C.boost) + icons.solo(50, 49, C.faint) + icons.gear(77, 49, C.faint);
      s += icons.left(338, 49, C.faint) + text(353, 49.5, "3", { size: 11, fill: C.muted }) + icons.right(368, 49, C.faint) + icons.bin(406, 49, C.faint) + icons.close(433, 49, C.faint);
      const seg = (x, y, n, w, on, cell) => rrect(x, y, n * w, 24, 6, "rgba(0,0,0,0.25)") + rrect(x + on * w + 2, y + 2, w - 4, 20, 4.5, "rgba(255,255,255,0.1)") +
        Array.from({ length: n }, (_, i) => cell(x + i * w + w / 2, y + 12, i === on)).join("");
      const shapes = ["peak", "hp", "lp", "ls", "hs"];
      s += seg(12, 86, 5, 22, 0, (x, y, on) => icons[shapes[(x - 23) / 22 | 0]](x, y, on ? C.accent : C.muted));
      const st = ["St", "M", "S", "L", "R"];
      s += seg(W - 122, 86, 5, 22, 1, (x, y, on) => text(x, y + 0.5, st[(x - (W - 122) - 11) / 22 | 0], { size: 10, weight: 600, fill: on ? C.accent : C.muted }));
      s += knob(cx - 76, 72, 22, 0.66) + knob(cx + 76, 72, 22, 0.55);
      s += text(cx - 76, 106, "2.40 kHz", { weight: 600, size: 10.5 }) + text(cx, 110, "+3.5 dB", { size: 10.5, weight: 600 }) + text(cx + 76, 106, "0.90", { size: 10.5, weight: 600 });
      return svg(124, s);
    },
  },
];

document.getElementById("grid").innerHTML = concepts.map((c) =>
  `<figure><figcaption><b>${c.name}</b><span>${c.note}</span></figcaption><div class="stage">${c.draw()}</div></figure>`).join("");
</script>
</body>
</html>
